<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="h24-title h24-desc"><title id="h24-title">Stable support and non-slip pads — reference illustration</title><desc id="h24-desc">Four round black feet. Short raised profiles. Shared adhesive backing sheet. The retired product photo shows feet only. It does not establish a stable support, base mounting, or required pad size. Illustration only; not to scale.</desc><defs><linearGradient id="h24-metal" x2=".85" y2="1"><stop stop-color="#f0f4f9"/><stop offset=".48" stop-color="#bbc5d2"/><stop offset="1" stop-color="#8491a2"/></linearGradient><linearGradient id="h24-brass" x2="1" y2=".3"><stop stop-color="#ac7c33"/><stop offset=".45" stop-color="#f5d798"/><stop offset="1" stop-color="#c69b50"/></linearGradient><radialGradient id="h24-ball" cx=".3" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f3f5f8"/><stop offset="1" stop-color="#dce2ea"/></radialGradient></defs><rect width="160" height="120" rx="16" fill="#f5f5f7"/><ellipse cx="82" cy="103" rx="46" ry="5" fill="#dbe1e9" opacity=".55"/><g stroke-linejoin="round"><path d="M29 49L102 29 135 78 61 99Z" fill="#383f49" stroke="#1e2836" stroke-width="1.5"/><ellipse cx="55" cy="58" rx="13" ry="8" fill="#151e2b"/><ellipse cx="55" cy="55" rx="13" ry="8" fill="#343e4d" stroke="#566171" stroke-width="1.5"/><ellipse cx="94" cy="47" rx="13" ry="8" fill="#151e2b"/><ellipse cx="94" cy="44" rx="13" ry="8" fill="#343e4d" stroke="#566171" stroke-width="1.5"/><ellipse cx="72" cy="81" rx="13" ry="8" fill="#151e2b"/><ellipse cx="72" cy="78" rx="13" ry="8" fill="#343e4d" stroke="#566171" stroke-width="1.5"/><ellipse cx="112" cy="69" rx="13" ry="8" fill="#151e2b"/><ellipse cx="112" cy="66" rx="13" ry="8" fill="#343e4d" stroke="#566171" stroke-width="1.5"/></g></svg>
