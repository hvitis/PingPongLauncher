<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="h17-title h17-desc"><title id="h17-title">Table tennis rubber + adhesive — reference illustration</title><desc id="h17-desc">Flat square rubber package. Black upper surface. Red sheet edge. The photograph shows a Butterfly Sriver rubber product. It does not validate tire thickness, cutting dimensions, or adhesive compatibility. Adhesive is not pictured. Illustration only; not to scale.</desc><defs><linearGradient id="h17-metal" x2=".85" y2="1"><stop stop-color="#f0f4f9"/><stop offset=".48" stop-color="#bbc5d2"/><stop offset="1" stop-color="#8491a2"/></linearGradient><linearGradient id="h17-brass" x2="1" y2=".3"><stop stop-color="#ac7c33"/><stop offset=".45" stop-color="#f5d798"/><stop offset="1" stop-color="#c69b50"/></linearGradient><radialGradient id="h17-ball" cx=".3" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f3f5f8"/><stop offset="1" stop-color="#dce2ea"/></radialGradient></defs><rect width="160" height="120" rx="16" fill="#f5f5f7"/><ellipse cx="82" cy="103" rx="46" ry="5" fill="#dbe1e9" opacity=".55"/><g stroke-linejoin="round"><path d="M38 42L113 27 130 80 56 97Z" fill="#d84843" stroke="#b53737" stroke-width="1.5"/><path d="M34 35L107 22 126 73 52 88Z" fill="#2c323c" stroke="#171f2b" stroke-width="1.5"/><path d="M52 88L56 97 130 80 126 73Z" fill="#a93036"/><path d="M42 40L103 29" stroke="#6e7784" stroke-width="1.3"/></g></svg>
