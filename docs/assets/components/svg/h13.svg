<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="h13-title h13-desc"><title id="h13-title">DC power supply — reference illustration</title><desc id="h13-desc">Enclosed black adapter. Attached flexible output lead. Barrel connector. The linked adapter is a 12 V / 5 A candidate, not the source 3 A unit. Confirm polarity and the load budget. Illustration only; not to scale.</desc><defs><linearGradient id="h13-metal" x2=".85" y2="1"><stop stop-color="#f0f4f9"/><stop offset=".48" stop-color="#bbc5d2"/><stop offset="1" stop-color="#8491a2"/></linearGradient><linearGradient id="h13-brass" x2="1" y2=".3"><stop stop-color="#ac7c33"/><stop offset=".45" stop-color="#f5d798"/><stop offset="1" stop-color="#c69b50"/></linearGradient><radialGradient id="h13-ball" cx=".3" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f3f5f8"/><stop offset="1" stop-color="#dce2ea"/></radialGradient></defs><rect width="160" height="120" rx="16" fill="#f5f5f7"/><ellipse cx="82" cy="103" rx="46" ry="5" fill="#dbe1e9" opacity=".55"/><g stroke-linejoin="round"><path d="M107 43Q143 26 139 62T112 96Q96 100 108 79" fill="none" stroke="#3d4654" stroke-width="4"/><rect x="35" y="31" width="69" height="55" rx="9" fill="#333b48" stroke="#1a2431" stroke-width="2"/><path d="M40 36H98V78H40Z" fill="#424c5b"/><path d="M40 79H99" stroke="#697484" stroke-width="1.5"/><rect x="99" y="78" width="20" height="8" rx="3" fill="#303947" transform="rotate(-30 109 82)"/><path d="M115 78L125 72" stroke="#aeb8c6" stroke-width="5"/></g></svg>
