<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="h22-title h22-desc"><title id="h22-title">40 mm table tennis balls — reference illustration</title><desc id="h22-desc">White spherical balls. Matte curved surfaces. Soft contact shadows. Generic ball appearance only; brand, batch behavior, diameter tolerance, and launcher performance are not verified. Illustration only; not to scale.</desc><defs><linearGradient id="h22-metal" x2=".85" y2="1"><stop stop-color="#f0f4f9"/><stop offset=".48" stop-color="#bbc5d2"/><stop offset="1" stop-color="#8491a2"/></linearGradient><linearGradient id="h22-brass" x2="1" y2=".3"><stop stop-color="#ac7c33"/><stop offset=".45" stop-color="#f5d798"/><stop offset="1" stop-color="#c69b50"/></linearGradient><radialGradient id="h22-ball" cx=".3" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f3f5f8"/><stop offset="1" stop-color="#dce2ea"/></radialGradient></defs><rect width="160" height="120" rx="16" fill="#f5f5f7"/><ellipse cx="82" cy="103" rx="46" ry="5" fill="#dbe1e9" opacity=".55"/><g stroke-linejoin="round"><ellipse cx="82" cy="89" rx="50" ry="8" fill="#e1e4e9"/><circle cx="101" cy="50" r="27" fill="url(#h22-ball)" stroke="#c4cbd5" stroke-width="1.5"/><circle cx="62" cy="68" r="29" fill="url(#h22-ball)" stroke="#bdc6d2" stroke-width="1.5"/><path d="M42 58Q56 43 75 49" stroke="#fff" stroke-width="2" fill="none"/></g></svg>
