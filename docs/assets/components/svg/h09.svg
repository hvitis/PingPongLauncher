<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="h09-title h09-desc"><title id="h09-title">M5 hex nuts — reference illustration</title><desc id="h09-desc">Six flat sides. Central threaded hole. Beveled metal edges. The reference photo is of M3 nuts. It shows hex-nut appearance only and does not establish the M5 pocket dimensions. Illustration only; not to scale.</desc><defs><linearGradient id="h09-metal" x2=".85" y2="1"><stop stop-color="#f0f4f9"/><stop offset=".48" stop-color="#bbc5d2"/><stop offset="1" stop-color="#8491a2"/></linearGradient><linearGradient id="h09-brass" x2="1" y2=".3"><stop stop-color="#ac7c33"/><stop offset=".45" stop-color="#f5d798"/><stop offset="1" stop-color="#c69b50"/></linearGradient><radialGradient id="h09-ball" cx=".3" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f3f5f8"/><stop offset="1" stop-color="#dce2ea"/></radialGradient></defs><rect width="160" height="120" rx="16" fill="#f5f5f7"/><ellipse cx="82" cy="103" rx="46" ry="5" fill="#dbe1e9" opacity=".55"/><g stroke-linejoin="round"><g transform="translate(80 59) scale(1)"><path d="M-30-18L0-32 30-18V17L0 33-30 17Z" fill="url(#h09-metal)" stroke="#7b8795" stroke-width="1.6"/><path d="M-30-18V17L0 33V-2Z" fill="#a5afbc"/><path d="M0-2L30-18V17L0 33Z" fill="#818d9e"/><path d="M-30-18L0-32 30-18 0-2Z" fill="#e5eaf1" stroke="#8591a0" stroke-width="1.2"/><ellipse cx="0" cy="-17" rx="12" ry="7.5" fill="#576170" stroke="#9ca7b5" stroke-width="2.5"/><path d="M-10-16Q0-10 10-16M-9-13Q0-8 9-13" fill="none" stroke="#c4ced9" stroke-width="1.5"/></g></g></svg>
