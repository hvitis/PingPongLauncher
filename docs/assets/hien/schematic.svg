<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820"><title>Proposed system schematic for Hien’s ping pong robot</title><desc>Wiring architecture showing ATX power split, Arduino Mega 2560 pin map, brushless ESCs, 4 servos and HM-10 BLE module.</desc><rect width="1100" height="820" rx="22" fill="#f5f7fa"/><g font-family="Arial,sans-serif" fill="#253347"><text x="35" y="40" font-size="20" fill="#253347" font-weight="bold">SYSTEM WIRING &amp;amp; ATX POWER DISTRIBUTION</text><text x="35" y="65" font-size="14" fill="#64748b">Separate high-current 12 V (ESCs) and 5 V (servos) rails from 250W ATX power supply; common ground</text><rect x="40" y="90" width="240" height="110" rx="12" fill="#fef3c7" stroke="#899bb1"/><text x="55" y="119" font-size="18" fill="#253347" font-weight="bold">250W PC ATX PSU</text><text x="55" y="143" font-size="13" fill="#52657e">Yellow +12V · Red +5V · Blk GND · Grn PS_ON</text><rect x="320" y="90" width="270" height="110" rx="12" fill="#dbeafe" stroke="#899bb1"/><text x="335" y="119" font-size="18" fill="#253347" font-weight="bold">Arduino Mega 2560</text><text x="335" y="143" font-size="13" fill="#52657e">16 MHz ATmega2560 · 54 GPIOs · 4 UARTs</text><rect x="630" y="90" width="210" height="110" rx="12" fill="#e0e7ff" stroke="#899bb1"/><text x="645" y="119" font-size="18" fill="#253347" font-weight="bold">HM-10 BLE 4.0</text><text x="645" y="143" font-size="13" fill="#52657e">Serial1 (D18/D19) · 3.3V logic level</text><rect x="880" y="90" width="180" height="110" rx="12" fill="#f1f5f9" stroke="#899bb1"/><text x="895" y="119" font-size="18" fill="#253347" font-weight="bold">iPhone App</text><text x="895" y="143" font-size="13" fill="#52657e">Ping Robot · BLE command link</text><rect x="40" y="230" width="310" height="95" rx="12" fill="#fee2e2" stroke="#899bb1"/><text x="55" y="259" font-size="18" fill="#253347" font-weight="bold">Twin HobbyKing YEP 18A ESCs</text><text x="55" y="283" font-size="13" fill="#52657e">Powered from ATX +12V rail · opto/signal only</text><rect x="390" y="230" width="310" height="95" rx="12" fill="#fee2e2" stroke="#899bb1"/><text x="405" y="259" font-size="18" fill="#253347" font-weight="bold">2x DT750 Brushless Motors</text><text x="405" y="283" font-size="13" fill="#52657e">750KV outrunners direct-driving BaneBots wheels</text><rect x="740" y="230" width="320" height="95" rx="12" fill="#fef3c7" stroke="#899bb1"/><text x="755" y="259" font-size="18" fill="#253347" font-weight="bold">4x MG995/MG996 Servos</text><text x="755" y="283" font-size="13" fill="#52657e">Pan, Tilt, Agitator, Gate · powered from ATX +5V</text><path d="M160 200 V230" stroke="#dc2626" stroke-width="4"/><path d="M350 277 H390" stroke="#dc2626" stroke-width="4"/><path d="M280 145 H320" stroke="#2563eb" stroke-width="3"/><path d="M590 145 H630" stroke="#4f46e5" stroke-width="3"/><path d="M840 145 H880" stroke="#0071e3" stroke-width="3" stroke-dasharray="4 4"/><text x="40" y="360" font-size="17" fill="#253347" font-weight="bold">PROPOSED POWER &amp;amp; SERVO DISTRIBUTION BREAKOUT (85 × 60 mm)</text><text x="40" y="385" font-size="13" fill="#64748b">Eliminates jumper wire bundle; isolates motor transients from controller logic.</text><rect x="40" y="405" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="428" font-size="15" fill="#253347" font-weight="bold">J1 Mega 10-pin Harness</text><text x="340" y="428" font-size="14" fill="#1e293b">1 GND · 2 +5V_LOGIC · 3 D2 · 4 D3 · 5 D4 · 6 D5 · 7 D6 · 8 D7 · 9 TX1 · 10 RX1</text><text x="340" y="448" font-size="12" fill="#64748b">Ribbon cable to Arduino Mega PWM and Serial1 pins</text><rect x="40" y="467" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="490" font-size="15" fill="#253347" font-weight="bold">J2 Top ESC / J3 Bottom ESC</text><text x="340" y="490" font-size="14" fill="#1e293b">Each: 1 GND · 2 NC (BEC cut) · 3 PWM Signal</text><text x="340" y="510" font-size="12" fill="#64748b">D2 (Top ESC throttle/topspin) · D3 (Bottom ESC throttle/backspin)</text><rect x="40" y="529" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="552" font-size="15" fill="#253347" font-weight="bold">J4 Agitator / J5 Gate Servo</text><text x="340" y="552" font-size="14" fill="#1e293b">Each: 1 GND · 2 +5V_ATX · 3 PWM Signal</text><text x="340" y="572" font-size="12" fill="#64748b">D4 (pusher_with_servo) · D5 (feed_base_with_servo)</text><rect x="40" y="591" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="614" font-size="15" fill="#253347" font-weight="bold">J6 Pan / J7 Tilt Servo</text><text x="340" y="614" font-size="14" fill="#1e293b">Each: 1 GND · 2 +5V_ATX · 3 PWM Signal</text><text x="340" y="634" font-size="12" fill="#64748b">D6 (turntable sweep) · D7 (elevation quadrant horn)</text><rect x="40" y="653" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="676" font-size="15" fill="#253347" font-weight="bold">J8 HM-10 BLE Header</text><text x="340" y="676" font-size="14" fill="#1e293b">1 GND · 2 +5V_LOGIC · 3 TXD (to Mega RX1) · 4 RXD (via 1k/2k divider)</text><text x="340" y="696" font-size="12" fill="#64748b">Logic level protection: 5V TX1 divided to 3.3V HM-10 RX</text><rect x="40" y="715" width="1020" height="54" rx="8" fill="#e8edf5"/><text x="55" y="738" font-size="15" fill="#253347" font-weight="bold">J9 ATX Power In</text><text x="340" y="738" font-size="14" fill="#1e293b">1 +12V_ATX · 2 GND · 3 GND · 4 +5V_ATX (Molex 4-pin)</text><text x="340" y="758" font-size="12" fill="#64748b">Heavy current input directly from PC ATX power supply wires</text><text x="40" y="785" font-size="14" fill="#475569">Filter capacitors: C1 1000 µF / 16V on +12V_ATX · C2 470 µF / 6.3V on +5V_ATX · C3 100 nF ceramic on +5V_LOGIC</text><text x="40" y="805" font-size="13" fill="#dc2626">All ground returns commoned at ATX star point. ESC internal BEC +5V disconnected to avoid backfeeding rails.</text></g></svg>
