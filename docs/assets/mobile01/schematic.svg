<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820"><title>Proposed Mobile01 system and control-breakout schematic</title><desc>External power and motor shield connections with a complete labelled connector net map. New proposed pins, not original source wiring.</desc><rect width="1100" height="820" rx="22" fill="#f5f7fa"/><g font-family="Arial,sans-serif" fill="#253347"><text x="35" y="40" font-size="19" fill="#253347">PROPOSED SYSTEM / MOTOR POWER STAYS OFF THE BREAKOUT</text><rect x="40" y="70" width="205" height="75" rx="12" fill="#e2edfc" stroke="#899bb1"/><text x="55" y="99" font-size="18" fill="#253347">USB → Mega logic</text><text x="55" y="123" font-size="13" fill="#253347">5 V logic source</text><rect x="365" y="70" width="295" height="75" rx="12" fill="#e2edfc" stroke="#899bb1"/><text x="380" y="99" font-size="18" fill="#253347">Mega 2560 + v1 shield</text><text x="380" y="123" font-size="13" fill="#253347">No complete source sketch supplied</text><rect x="775" y="70" width="280" height="75" rx="12" fill="#e2edfc" stroke="#899bb1"/><text x="790" y="99" font-size="18" fill="#253347">M1 / M2 / M3</text><text x="790" y="123" font-size="13" fill="#253347">Left wheel / right wheel / feeder</text><path d="M245 105 H365 M660 105 H775" stroke="#0071e3" stroke-width="3"/><rect x="40" y="180" width="270" height="80" rx="12" fill="#fff0dc" stroke="#899bb1"/><text x="55" y="209" font-size="18" fill="#253347">Motor supply → fuse</text><text x="55" y="233" font-size="13" fill="#253347">Disconnect → EXT_PWR; jumper OFF</text><rect x="775" y="180" width="280" height="80" rx="12" fill="#fff0dc" stroke="#899bb1"/><text x="790" y="209" font-size="18" fill="#253347">Servo / independent 5 V</text><text x="790" y="233" font-size="13" fill="#253347">D9 signal; ground shared; +5 V isolated</text><path d="M310 220 H335 V125 H365" fill="none" stroke="#cd8133" stroke-width="3"/><path d="M650 145 V220 H775" fill="none" stroke="#0071e3" stroke-width="3"/><text x="40" y="290" font-size="16" fill="#253347">All grounds common. Motor/servo returns bypass the control PCB. Do not join supply positive rails.</text><text x="40" y="329" font-size="18" fill="#253347">CONTROL BREAKOUT / NET-LABEL SCHEMATIC</text><rect x="40" y="350" width="1015" height="64" rx="8" fill="#e4edf8"/><text x="55" y="375" font-size="16" fill="#253347">J1 Mega harness</text><text x="400" y="375" font-size="16" fill="#253347">1 GND · 2 +5V_LOGIC</text><text x="400" y="398" font-size="13" fill="#52657e">3 A0 · 4 A1 · 5 A2 · 6 D22 · 7 D24 · 8 D26</text><rect x="40" y="423" width="1015" height="64" rx="8" fill="#e4edf8"/><text x="55" y="448" font-size="16" fill="#253347">J2 feed / J3 speed / J4 sweep</text><text x="400" y="448" font-size="16" fill="#253347">Each: 1 GND · 2 wiper · 3 +5V_LOGIC</text><text x="400" y="471" font-size="13" fill="#52657e">Wipers → A0 / A1 / A2 respectively; external B10K pots</text><rect x="40" y="496" width="1015" height="64" rx="8" fill="#e4edf8"/><text x="55" y="521" font-size="16" fill="#253347">J5 ball switch</text><text x="400" y="521" font-size="16" fill="#253347">1 GND → COM · 2 D22 → NO</text><text x="400" y="544" font-size="13" fill="#52657e">INPUT_PULLUP; active low; debounce in firmware</text><rect x="40" y="569" width="1015" height="64" rx="8" fill="#e4edf8"/><text x="55" y="594" font-size="16" fill="#253347">J6 IR receiver module</text><text x="400" y="594" font-size="16" fill="#253347">1 GND · 2 +5V_LOGIC · 3 D24</text><text x="400" y="617" font-size="13" fill="#52657e">Reorder harness to match the selected HX1838 module</text><rect x="40" y="642" width="1015" height="64" rx="8" fill="#e4edf8"/><text x="55" y="667" font-size="16" fill="#253347">J7 passive buzzer driver module</text><text x="400" y="667" font-size="16" fill="#253347">1 GND · 2 +5V_LOGIC · 3 D26</text><text x="400" y="690" font-size="13" fill="#52657e">External driver accepts 5 V logic and tone pulses</text><text x="40" y="748" font-size="16" fill="#253347">C1 100 nF ceramic and C2 10 µF / ≥10 V: between +5V_LOGIC and GND.</text><text x="40" y="778" font-size="13" fill="#52657e">Named nets define electrical connections. Connector ordering is a new design choice; verify hardware before wiring.</text></g></svg>
